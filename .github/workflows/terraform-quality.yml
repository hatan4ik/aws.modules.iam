name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          # examples/sandbox-delivery-caller is documentation-only (a README
          # with an HCL code fence, no .tf files) and is deliberately not
          # listed here: this module has no safe way to plan, lint, or scan a
          # second, disposable copy of the resources it creates. See that
          # example's README and docs/DESIGN.md for why.
          - .
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true
